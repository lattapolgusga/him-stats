<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H.I.M. Thailand — ระบบสถิติคริสตจักร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#06C755;--b:#1F4E78;--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#6b7785;--r:#d9534f;--y:#f0ad4e}
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{background:var(--b);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}button{font-family:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--b);color:#fff}
button.sec{background:#e6ebf1;color:var(--t)}button.line{background:var(--g)}.tabs button{background:transparent;color:#cfe0f0}.tabs button.on{background:#ffffff22;color:#fff}
main{max-width:1150px;margin:0 auto;padding:18px}.card{background:var(--c);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi .v{font-size:28px;font-weight:700}.kpi .l{color:var(--m);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid #eef1f4;text-align:left}th{color:var(--m);font-weight:600;position:sticky;top:0;background:#fff}
.tw{max-height:480px;overflow:auto}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e6ebf1}
.XS{background:#fde2e1}.S{background:#fff1d6}.M{background:#dff3e4}.L{background:#d6e9fb}.dn{color:var(--r);font-weight:600}.up{color:#2e8b57;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.bar span:first-child{width:80px}.bar .t{flex:1;background:#eef1f4;border-radius:6px;height:16px;overflow:hidden}.bar .f{height:100%;background:var(--b)}
input,select{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid #cdd5df;border-radius:8px;width:100%}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}
.login{max-width:420px;margin:50px auto;text-align:center}.ok{background:#dff3e4;color:#1e6b3a;padding:10px;border-radius:8px;margin-top:10px}
.chat{height:420px;overflow:auto;background:#8cabd9;border-radius:10px;padding:12px}.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;font-size:14px}
.me{background:#06C755;color:#fff;margin-left:auto}.bot{background:#fff}.chips button{margin:4px 4px 0 0;font-size:12px;padding:5px 10px}
.note{font-size:12px;color:var(--m)}.hide{display:none}
</style>
<script src="config.js"></script></head><body>
<header><b>⛪ H.I.M. Thailand · ระบบสถิติ</b><span class="sp"></span><span class="tabs" id="tabs"></span><span id="who" style="font-size:13px"></span></header>
<main id="app"><div class="card login">กำลังโหลด…</div></main>
<script>
const CFG=window.HIM_CONFIG;const A=()=>document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);const RL=r=>r;
let ME=null,view='',cur=null,BY={},ROUNDS=[];
let TOKEN=null;try{TOKEN=localStorage.getItem('him_t')}catch(e){}
async function api(action,extra={}){const r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:TOKEN,...extra})});const j=await r.json();
 if(!j.ok){if(j.error=='SESSION'){setT(null);loginV();throw new Error('กรุณาเข้าสู่ระบบใหม่')}throw new Error(j.error)}return j.data}
function setT(t){TOKEN=t;try{t?localStorage.setItem('him_t',t):localStorage.removeItem('him_t')}catch(e){}}
function err(e){A().innerHTML=`<div class="card login"><p class="dn">${esc(e.message||e)}</p><button onclick="location.reload()">ลองใหม่</button></div>`}
async function boot(){try{if(TOKEN)return await load();const st=await api('status');st.needsAdmin?bootV():loginV()}catch(e){if(document.getElementById('lu'))return;err(e)}}
function loginV(msg){document.getElementById('tabs').innerHTML='';document.getElementById('who').textContent='';
 A().innerHTML=`<form class="card login" onsubmit="event.preventDefault();doLogin()"><div style="font-size:40px">⛪</div><h3>เข้าสู่ระบบ</h3>
 <input id="lu" list="nl" placeholder="ชื่อกลุ่ม / คริสตจักร หรือรหัส" autocomplete="username"><datalist id="nl"></datalist><input id="lp" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" style="margin-top:8px">
 <button id="lb" style="width:100%;margin-top:12px">เข้าสู่ระบบ</button><div id="lm">${msg?`<p class="dn">${esc(msg)}</p>`:''}</div><p class="note">ลืมรหัสผ่าน ติดต่อแอดมินส่วนกลาง</p></form>`;api('names').then(n=>{const d=document.getElementById('nl');if(d)d.innerHTML=n.map(([a,u])=>`<option value="${esc(a)}">${esc(u)}</option>`).join('')}).catch(()=>{})}
async function doLogin(){lb.disabled=true;lb.textContent='กำลังตรวจสอบ…';try{const r=await api('login',{username:lu.value,password:lp.value});setT(r.token);await load()}catch(e){lm.innerHTML=`<p class="dn">${esc(e.message)}</p>`;lb.disabled=false;lb.textContent='เข้าสู่ระบบ'}}
function bootV(){A().innerHTML=`<form class="card login" onsubmit="event.preventDefault();doBoot()"><h3>ตั้งค่าแอดมินคนแรก</h3><p class="note">ทำครั้งเดียว หลังจากนี้แอดมินสร้างบัญชีให้คนอื่นในระบบ</p>
 <input id="bn" placeholder="ชื่อที่แสดง"><input id="lu" placeholder="username (a-z 0-9)" style="margin-top:8px"><input id="lp" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" style="margin-top:8px">
 <button id="lb" style="width:100%;margin-top:12px">สร้างแอดมิน</button><div id="lm"></div></form>`}
async function doBoot(){try{const r=await api('bootstrap',{name:bn.value,username:lu.value,password:lp.value});setT(r.token);await load()}catch(e){lm.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
async function load(){A().innerHTML='<div class="card login">กำลังโหลดข้อมูล…</div>';ME=await api('me');ME.role=ME.user.role;ME.name=ME.user.name;
 document.getElementById('who').innerHTML='👤 '+esc(ME.name)+' <button class="sec" style="padding:4px 10px;margin-left:6px" onclick="logout()">ออก</button>';
 BY={};ME.stats.forEach(s=>(BY[s.code]=BY[s.code]||{})[s.round]=s.n);ROUNDS=[...new Set(ME.stats.map(s=>s.round).concat([ME.round]))].sort();
 cur=ME.churches[0];view=ME.role=='admin'?'dash':(cur?'form':'acct');render()}
async function logout(){try{await api('logout')}catch(e){}setT(null);loginV()}
const val=(c,r)=>(BY[c.code]||{})[r];const latest=c=>{for(let i=ROUNDS.length-1;i>=0;i--)if(val(c,ROUNDS[i])!=null)return val(c,ROUNDS[i]);return null};
const prevOf=c=>{let f=0;for(let i=ROUNDS.length-1;i>=0;i--)if(val(c,ROUNDS[i])!=null){if(f)return val(c,ROUNDS[i]);f=1}return null};
const size=v=>v==null?'':v<30?'XS':v<=50?'S':v<=100?'M':'L';
function regV(){A().innerHTML=`<div class="card login"><h3>ลงทะเบียนครั้งแรก</h3><p class="note">ใส่รหัสคริสตจักรที่ได้รับจากผู้ดูแลภาค (เช่น N1-001)</p><input id="cc" placeholder="รหัสคริสตจักร"><button style="width:100%;margin-top:10px" onclick="reqB()">ส่งคำขอ</button><div id="m"></div></div>`}
async function reqB(){try{await api('request',{code:cc.value});load()}catch(e){m.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
function render(){const tabs=ME.role=='admin'?[['dash','แดชบอร์ด'],['list','ทะเบียน'],['users','ผู้ใช้'],['acct','บัญชีของฉัน']]:[['form','กรอกสถิติ'],['mine','ข้อมูลของฉัน'],['acct','บัญชีของฉัน']];
 document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="${view==k?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');
 ({dash:dashV,list:listV,users:usersV,acct:acctV,form:formV,mine:mineV})[view]()}
function formV(){const c=cur;A().innerHTML=`<div class="card" style="max-width:520px;margin:auto">${ME.churches.length>1?`<label>คริสตจักรที่ดูแล</label><select onchange="cur=ME.churches.find(x=>x.code==this.value);render()">${ME.churches.map(x=>`<option ${x==c?'selected':''} value="${x.code}">${esc(x.name)}</option>`).join('')}</select>`:''}
 <h3 style="margin:10px 0 2px">${esc(c.name)}</h3><div class="note">${c.code} · ${esc(c.reg)} · ${esc(c.type)}${c.prov?" · จ."+esc(c.prov):""}<br>ผู้นำ: ${esc(c.leader||"—")}${c.phone?" · โทร "+esc(c.phone):""} · <a href="#" onclick="view='mine';render();return false">ดูข้อมูลทั้งหมด</a></div><h4>ส่งสถิติรอบ ${ME.round} ${val(c,ME.round)!=null?'<span class="tag M">ส่งแล้ว</span>':''}</h4>
 <label>จำนวนคนมานมัสการ (เฉลี่ย) *</label><input id="f1" type="number" min="0" inputmode="numeric" value="${val(c,ME.round)??''}" placeholder="ครั้งก่อน ${latest(c)??'-'} คน">
 <div class="row"><div><label>ผู้มาใหม่</label><input id="f2" type="number" min="0"></div><div><label>บัพติศมา</label><input id="f3" type="number" min="0"></div><div><label>Life Group</label><input id="f4" type="number" min="0"></div></div>
 <label>เรื่องอธิษฐาน / ข่าว</label><input id="f5"><button id="sb" style="width:100%;margin-top:14px" onclick="sub()">ส่งสถิติ</button><div id="fm"></div></div>`}
async function sub(){if(f1.value==='')return fm.innerHTML='<p class="dn">กรุณาใส่จำนวนคน</p>';sb.disabled=true;sb.textContent='กำลังส่ง…';
 try{await api('submit',{code:cur.code,n:+f1.value,nw:f2.value,bp:f3.value,lg:f4.value,note:f5.value});(BY[cur.code]=BY[cur.code]||{})[ME.round]=+f1.value;fm.innerHTML='<div class="ok">✅ บันทึกแล้ว ขอบคุณครับ</div>'}catch(e){fm.innerHTML=`<p class="dn">${esc(e.message)}</p>`}sb.disabled=false;sb.textContent='ส่งสถิติ'}
function infoCard(c){const d=v=>v?esc(v instanceof Object?v:String(v).slice(0,10)):'<span class="note">—</span>';const l=latest(c);
 return `<table>${[['รหัส',esc(c.code)],['ชื่อ',esc(c.name)],['ภาค',esc(c.reg)],['จังหวัด',d(c.prov)],['ประเภท',esc(c.type)],['ผู้นำ / ศบ.',d(c.leader)],['เบอร์โทร',d(c.phone)],['อีเมล',d(c.email)],['ไซส์เสื้อ',d(c.shirt)],['ขึ้นทะเบียน',d(c.reged)+(c.regdate?' ('+d(c.regdate)+')':'')],['สถานะ',d(c.status)],['ยอดล่าสุด',l!=null?l+' คน':'—'],['ขนาด',size(l)?`<span class="tag ${size(l)}">${size(l)}</span>`:'—'],['หมายเหตุ',d(c.note)]].map(([a,b])=>`<tr><th style="width:38%">${a}</th><td>${b}</td></tr>`).join('')}</table>`}
function editV(){const c=cur,rd=String(c.regdate||'').slice(0,10);A().innerHTML=`<form class="card" style="max-width:560px;margin:auto" onsubmit="event.preventDefault();saveInfo()"><h3>แก้ไขข้อมูล · ${esc(c.name)}</h3><p class="note">${c.code} · ${esc(c.reg)} · ${esc(c.type)} (ภาค/ประเภท แก้ได้เฉพาะแอดมิน)</p>
 <label>ชื่อผู้นำ / ศบ.</label><input id="e1" value="${esc(c.leader||'')}"><div class="row"><div><label>เบอร์โทร</label><input id="e2" inputmode="tel" value="${esc(c.phone||'')}"></div><div><label>อีเมล</label><input id="e3" type="email" value="${esc(c.email||'')}"></div></div>
 <div class="row"><div><label>จังหวัด</label><input id="e4" value="${esc(c.prov||'')}"></div><div><label>ไซส์เสื้อ</label><select id="e5">${['','S','M','L','XL','XXL','3XL'].map(x=>`<option ${String(c.shirt||'')==x?'selected':''}>${x}</option>`).join('')}</select></div></div>
 <h4 style="margin-bottom:4px">การขึ้นทะเบียน ศบ.</h4><label><input id="e6" type="checkbox" style="width:auto" ${c.reged?'checked':''}> ขึ้นทะเบียนแล้ว</label><label>วันที่ขึ้นทะเบียน</label><input id="e7" type="date" value="${/^\d{4}-\d{2}-\d{2}$/.test(rd)?rd:''}">
 <div class="row" style="margin-top:14px"><button class="sec" type="button" onclick="view='mine';render()">ยกเลิก</button><button id="eb">บันทึก</button></div><div id="em"></div></form>`}
async function saveInfo(){eb.disabled=true;const d={code:cur.code,leader:e1.value,phone:e2.value,email:e3.value,prov:e4.value,shirt:e5.value,reged:e6.checked,regdate:e7.value};
 try{await api('updateInfo',d);Object.assign(cur,{leader:d.leader,phone:d.phone,email:d.email,prov:d.prov,shirt:d.shirt,reged:d.reged?'ขึ้นทะเบียนแล้ว':'',regdate:d.reged?d.regdate:''});view='mine';render()}catch(e){em.innerHTML=`<p class="dn">${esc(e.message)}</p>`;eb.disabled=false}}
function mineV(){const c=cur,rs=ROUNDS.filter(r=>val(c,r)!=null),mx=Math.max(1,...rs.map(r=>val(c,r)));const S=ME.stats.filter(s=>s.code==c.code).sort((a,b)=>a.round<b.round?1:-1);
 A().innerHTML=`${ME.churches.length>1?`<div class="card"><select onchange="cur=ME.churches.find(x=>x.code==this.value);render()">${ME.churches.map(x=>`<option ${x==c?'selected':''} value="${x.code}">${esc(x.name)}</option>`).join('')}</select></div>`:''}<div class="grid2"><div class="card"><h3>ข้อมูลคริสตจักร</h3>${infoCard(c)}<button style="width:100%;margin-top:10px" onclick="editV()">✏️ แก้ไขข้อมูล</button></div>
 <div><div class="card"><h3>ยอดย้อนหลัง</h3>${rs.map(r=>`<div class="bar"><span>${r}</span><div class="t"><div class="f" style="width:${val(c,r)/mx*100}%"></div></div><b>${val(c,r)}</b></div>`).join('')||'<p class="note">ยังไม่มีข้อมูล</p>'}</div>
 <div class="card"><h3>ประวัติการส่ง</h3><div class="tw"><table><tr><th>รอบ</th><th>คน</th><th>ใหม่</th><th>บัพติศมา</th><th>LG</th><th>หมายเหตุ</th></tr>${S.map(s=>`<tr><td>${s.round}</td><td>${s.n}</td><td>${s.nw||''}</td><td>${s.bp||''}</td><td>${s.lg||''}</td><td>${esc(s.note||'')}</td></tr>`).join('')}</table></div></div></div></div>`}
function dashV(){const C=ME.churches,R=ME.round,sub=C.filter(c=>val(c,R)!=null).length;const REGS=[...new Set(C.map(c=>c.reg))];
 const reg=REGS.map(g=>{const a=C.filter(c=>c.reg==g);return[g,sum(a,latest)]}).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,reg[0]?.[1]||1);
 const drops=C.map(c=>[c,prevOf(c),latest(c)]).filter(([c,p,l])=>p>=15&&l<p*.8);const t=k=>C.filter(c=>c.type==k).length;
 A().innerHTML=`<div class="kpis">${[['แห่งทั้งหมด',C.length,`คจ ${t('คริสตจักร')} · ศูนย์ ${t('ศูนย์')} · บุกเบิก ${t('กลุ่มบุกเบิก')}`],['ยอดล่าสุดรวม',sum(C,latest).toLocaleString(),'คน'],[`ส่งรอบ ${R}`,`${sub}/${C.length}`,Math.round(sub/C.length*100)+'%'],['ควรติดตาม',drops.length,'ยอดลดเกิน 20%']].map(([l,v,s])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="note">${s}</div></div>`).join('')}</div>
 <div class="grid2"><div class="card"><h3>ยอดรายภาค</h3>${reg.map(([g,v])=>`<div class="bar"><span>${esc(g)}</span><div class="t"><div class="f" style="width:${v/mx*100}%"></div></div><b>${v}</b></div>`).join('')}</div>
 <div class="card"><h3>🙏 ควรเยี่ยมเยียน</h3><div class="tw"><table>${drops.map(([c,p,l])=>`<tr><td>${esc(c.name)}</td><td>${esc(c.reg)}</td><td class="dn">${p}→${l}</td></tr>`).join('')}</table></div></div></div>`}
let F={q:'',reg:'',ns:false};
function listV(){const REGS=[...new Set(ME.churches.map(c=>c.reg))].sort();A().innerHTML=`<div class="card"><div class="row"><div><label>ค้นหา</label><input oninput="F.q=this.value;tbl()" value="${esc(F.q)}"></div><div><label>ภาค</label><select onchange="F.reg=this.value;tbl()"><option value="">ทุกภาค</option>${REGS.map(g=>`<option ${F.reg==g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div><label><input type="checkbox" style="width:auto" onchange="F.ns=this.checked;tbl()" ${F.ns?'checked':''}> ยังไม่ส่ง</label></div></div><p class="note" id="cnt"></p><div class="tw" id="tb"></div></div>`;tbl()}
function tbl(){const q=F.q.toLowerCase(),a=ME.churches.filter(c=>(!q||(c.name+c.leader+c.code).toLowerCase().includes(q))&&(!F.reg||c.reg==F.reg)&&(!F.ns||val(c,ME.round)==null));
 cnt.textContent=a.length+' แห่ง';tb.innerHTML=`<table><tr><th>รหัส</th><th>ชื่อ</th><th>ภาค</th><th>ผู้นำ</th>${ROUNDS.map(r=>`<th>${r}</th>`).join('')}<th>ขนาด</th></tr>${a.map(c=>`<tr><td>${c.code}</td><td><a href="#" onclick="cur=ME.churches.find(x=>x.code=='${c.code}');view='mine';render();return false">${esc(c.name)}</a></td><td>${esc(c.reg)}</td><td>${esc(c.leader)}</td>${ROUNDS.map(r=>`<td>${val(c,r)??'–'}</td>`).join('')}<td>${size(latest(c))?`<span class="tag ${size(latest(c))}">${size(latest(c))}</span>`:''}</td></tr>`).join('')}</table>`}
async function usersV(){A().innerHTML='<div class="card">กำลังโหลด…</div>';try{const U=await api('users');
 A().innerHTML=`<div class="grid2"><form class="card" onsubmit="event.preventDefault();mkU()"><h3>สร้างบัญชีใหม่</h3>
 <label>username</label><input id="nu" placeholder="เช่น n1-001 หรือ somchai"><label>ชื่อที่แสดง</label><input id="nn">
 <label>รหัสคริสตจักรที่ดูแล (คั่นด้วย , )</label><input id="nc" placeholder="N1-001,N1-002"><label>บทบาท</label><select id="nr"><option value="leader">ผู้นำคริสตจักร</option><option value="admin">แอดมิน</option></select>
 <button style="width:100%;margin-top:12px">สร้างบัญชี</button><div id="um"></div></form>
 <div class="card"><h3>บัญชีทั้งหมด (${U.length})</h3><div class="tw"><table><tr><th>username</th><th>ชื่อ</th><th>คจ.</th><th>LINE</th><th></th></tr>${U.map(u=>`<tr><td>${esc(u.username)}${u.role=='admin'?' <span class="tag L">admin</span>':''}</td><td>${esc(u.name)}</td><td>${esc(u.codes.join(', '))}</td><td>${u.line?'✅':''}</td><td style="white-space:nowrap"><button class="sec" onclick="rsP('${esc(u.username)}')">รีเซ็ตรหัส</button> <button class="sec" onclick="stU('${esc(u.username)}','${u.status=='active'?'disabled':'active'}')">${u.status=='active'?'ปิด':'เปิด'}</button></td></tr>`).join('')}</table></div></div></div>`}catch(e){err(e)}}
function showPw(r){return `<div class="ok">✅ username: <b>${esc(r.username)}</b><br>รหัสผ่านชั่วคราว: <b>${esc(r.password)}</b><br><span class="note">แสดงครั้งเดียว ส่งให้เจ้าของบัญชีแบบส่วนตัว และให้เปลี่ยนรหัสหลังเข้าระบบ</span></div>`}
async function mkU(){try{const r=await api('createUser',{username:nu.value,name:nn.value,codes:nc.value,role:nr.value});await usersV();um.innerHTML=showPw(r)}catch(e){um.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
async function rsP(u){try{const r=await api('resetPassword',{username:u});await usersV();um.innerHTML=showPw(r)}catch(e){um.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
async function stU(u,st){try{await api('setStatus',{username:u,status:st});usersV()}catch(e){um.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
function acctV(){A().innerHTML=`<div class="grid2"><form class="card" onsubmit="event.preventDefault();chP()"><h3>เปลี่ยนรหัสผ่าน</h3><label>รหัสผ่านเดิม</label><input id="po" type="password"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label><input id="pn" type="password"><button style="width:100%;margin-top:12px">บันทึก</button><div id="pm"></div></form>
 <div class="card"><h3>เชื่อม LINE OA (เลขา)</h3><p class="note">เพื่อถามข้อมูลสถิติผ่านแชท LINE OA "งานพันธกิจ H.I.M."</p><button onclick="lnk()">ขอรหัสเชื่อม</button><div id="lk"></div></div></div>`}
async function chP(){try{await api('password',{old:po.value,password:pn.value});pm.innerHTML='<div class="ok">✅ เปลี่ยนรหัสผ่านแล้ว</div>';po.value=pn.value=''}catch(e){pm.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
async function lnk(){try{const r=await api('linkcode');lk.innerHTML=`<div class="ok">พิมพ์ในแชท OA ว่า<br><b style="font-size:22px">เชื่อม ${r.code}</b><br><span class="note">รหัสใช้ได้ 10 นาที</span></div>`}catch(e){lk.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
boot();
</script></body></html>
