<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H.I.M. Thailand — ระบบสถิติคริสตจักร</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#06C755;--b:#1F4E78;--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#6b7785;--r:#d9534f;--y:#f0ad4e}
*{box-sizing:border-box}body{margin:0;font-family:Sarabun,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
header{background:var(--b);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}button{font-family:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--b);color:#fff}
button.sec{background:#e6ebf1;color:var(--t)}button.line{background:var(--g)}.tabs button{background:transparent;color:#cfe0f0}.tabs button.on{background:#ffffff22;color:#fff}
main{max-width:1150px;margin:0 auto;padding:18px}.card{background:var(--c);border-radius:12px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi .v{font-size:28px;font-weight:700}.kpi .l{color:var(--m);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid #eef1f4;text-align:left}th{color:var(--m);font-weight:600;position:sticky;top:0;background:#fff}
.tw{max-height:480px;overflow:auto}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#e6ebf1}
.XS{background:#fde2e1}.S{background:#fff1d6}.M{background:#dff3e4}.L{background:#d6e9fb}.dn{color:var(--r);font-weight:600}.up{color:#2e8b57;font-weight:600}
.pg{margin:6px 0}.pg .h{display:flex;justify-content:space-between;font-size:13px}.pg .t{background:#eef1f4;border-radius:8px;height:14px;overflow:hidden}.pg .f{height:100%;border-radius:8px}.donut{width:120px;height:120px;border-radius:50%;display:inline-block}.leg span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px}.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px 16px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.bar span:first-child{width:80px}.bar .t{flex:1;background:#eef1f4;border-radius:6px;height:16px;overflow:hidden}.bar .f{height:100%;background:var(--b)}
input,select{font-family:inherit;font-size:15px;padding:8px 10px;border:1px solid #cdd5df;border-radius:8px;width:100%}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}
.login{max-width:420px;margin:50px auto;text-align:center}.ok{background:#dff3e4;color:#1e6b3a;padding:10px;border-radius:8px;margin-top:10px}
.chat{height:420px;overflow:auto;background:#8cabd9;border-radius:10px;padding:12px}.msg{max-width:80%;padding:8px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap;font-size:14px}
.me{background:#06C755;color:#fff;margin-left:auto}.bot{background:#fff}.chips button{margin:4px 4px 0 0;font-size:12px;padding:5px 10px}
.note{font-size:12px;color:var(--m)}.hide{display:none}
</style>
<script src="config.js"></script></head><body>
<header><b>⛪ H.I.M. Thailand · ระบบสถิติ</b><span class="sp"></span><span class="tabs" id="tabs"></span><span id="who" style="font-size:13px"></span></header>
<div id="strip" style="max-width:1200px;margin:12px auto 0;padding:0 16px"></div><main id="app"><div class="card login">กำลังโหลด…</div></main>
<script>
const CFG=window.HIM_CONFIG;const A=()=>document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);const RL=r=>r;
let ME=null,view='',cur=null,BY={},ROUNDS=[];
let TOKEN=null;try{TOKEN=localStorage.getItem('him_t')}catch(e){}
async function api(action,extra={}){const r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:TOKEN,...extra})});const j=await r.json();
 if(!j.ok){if(j.error=='SESSION'){setT(null);loginV();throw new Error('กรุณาเข้าสู่ระบบใหม่')}throw new Error(j.error)}return j.data}
function setT(t){TOKEN=t;try{t?localStorage.setItem('him_t',t):localStorage.removeItem('him_t')}catch(e){}}
function err(e){A().innerHTML=`<div class="card login"><p class="dn">${esc(e.message||e)}</p><button onclick="location.reload()">ลองใหม่</button></div>`}
async function boot(){try{if(TOKEN)return await load();const st=await api('status');st.needsAdmin?bootV():loginV()}catch(e){if(document.getElementById('lu'))return;err(e)}}
function loginV(msg){document.getElementById('tabs').innerHTML='';document.getElementById('strip').innerHTML='';document.getElementById('who').textContent='';
 A().innerHTML=`<form class="card login" onsubmit="event.preventDefault();doLogin()"><div style="font-size:40px">⛪</div><h3>เข้าสู่ระบบ</h3>
 <input id="lu" list="nl" placeholder="ชื่อกลุ่ม / คริสตจักร หรือรหัส" autocomplete="username"><datalist id="nl"></datalist><input id="lp" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" style="margin-top:8px">
 <button id="lb" style="width:100%;margin-top:12px">เข้าสู่ระบบ</button><div id="lm">${msg?`<p class="dn">${esc(msg)}</p>`:''}</div><p class="note">ลืมรหัสผ่าน ติดต่อแอดมินส่วนกลาง</p></form>`;api('names').then(n=>{const d=document.getElementById('nl');if(d)d.innerHTML=n.map(([a,u])=>`<option value="${esc(a)}">${esc(u)}</option>`).join('')}).catch(()=>{})}
async function doLogin(){lb.disabled=true;lb.textContent='กำลังตรวจสอบ…';try{const r=await api('login',{username:lu.value,password:lp.value});setT(r.token);await load()}catch(e){lm.innerHTML=`<p class="dn">${esc(e.message)}</p>`;lb.disabled=false;lb.textContent='เข้าสู่ระบบ'}}
function bootV(){A().innerHTML=`<form class="card login" onsubmit="event.preventDefault();doBoot()"><h3>ตั้งค่าแอดมินคนแรก</h3><p class="note">ทำครั้งเดียว หลังจากนี้แอดมินสร้างบัญชีให้คนอื่นในระบบ</p>
 <input id="bn" placeholder="ชื่อที่แสดง"><input id="lu" placeholder="username (a-z 0-9)" style="margin-top:8px"><input id="lp" type="password" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" style="margin-top:8px">
 <button id="lb" style="width:100%;margin-top:12px">สร้างแอดมิน</button><div id="lm"></div></form>`}
async function doBoot(){try{const r=await api('bootstrap',{name:bn.value,username:lu.value,password:lp.value});setT(r.token);await load()}catch(e){lm.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
async function load(){A().innerHTML='<div class="card login">กำลังโหลดข้อมูล…</div>';ME=await api('me');ME.role=ME.user.role;ME.name=ME.user.name;
 document.getElementById('who').innerHTML='👤 '+esc(ME.name)+' <button class="sec" style="padding:4px 10px;margin-left:6px" onclick="logout()">ออก</button>';
 BY={};ME.stats.forEach(s=>(BY[s.code]=BY[s.code]||{})[s.round]=s.n);ROUNDS=[...new Set(ME.stats.map(s=>s.round).concat([ME.round]))].sort();
 cur=ME.churches[0];view=ME.role=='admin'?'dash':(cur?'form':'acct');render()}
async function logout(){try{await api('logout')}catch(e){}setT(null);loginV()}
const val=(c,r)=>(BY[c.code]||{})[r];const latest=c=>{for(let i=ROUNDS.length-1;i>=0;i--)if(val(c,ROUNDS[i])!=null)return val(c,ROUNDS[i]);return null};
const prevOf=c=>{let f=0;for(let i=ROUNDS.length-1;i>=0;i--)if(val(c,ROUNDS[i])!=null){if(f)return val(c,ROUNDS[i]);f=1}return null};
const size=v=>v==null?'':v<30?'XS':v<=50?'S':v<=100?'M':'L';
function regV(){A().innerHTML=`<div class="card login"><h3>ลงทะเบียนครั้งแรก</h3><p class="note">ใส่รหัสคริสตจักรที่ได้รับจากผู้ดูแลภาค (เช่น N1-001)</p><input id="cc" placeholder="รหัสคริสตจักร"><button style="width:100%;margin-top:10px" onclick="reqB()">ส่งคำขอ</button><div id="m"></div></div>`}
async function reqB(){try{await api('request',{code:cc.value});load()}catch(e){m.innerHTML=`<p class="dn">${esc(e.message)}</p>`}}
function render(){const TB={admin:[['exec','ภาพรวมผู้บริหาร'],['dash','แดชบอร์ด'],['list','ทะเบียน'],['rep','รายงานภาค'],['users','ผู้ใช้'],['acct','บัญชีของฉัน']],
 exec:[['exec','ภาพรวมผู้บริหาร'],['list','ทะเบียน'],['rep','รายงานภาค'],['acct','บัญชีของฉัน']],
 coord:[['dash','ภาพรวมภาค'],['list','ติดตามการส่ง'],['form','กรอกสถิติ'],['rep','รายงานภาค'],['acct','บัญชีของฉัน']]};
 const tabs=TB[ME.role]||[['form','กรอกสถิติ'],['rep','รายงานภาค'],['mine','ข้อมูลของฉัน'],['acct','บัญชีของฉัน']];if(!tabs.some(t=>t[0]==view))view=tabs[0][0];
 document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="${view==k?'on':''}" onclick="view='${k}';render()">${l}</button>`).join('');
 document.getElementById('strip').innerHTML=strip();
 ({dash:dashV,list:listV,users:usersV,acct:acctV,form:formV,mine:mineV,rep:repV,exec:execV})[view]()}
const AGD=['ย้ำนิมิตองค์กรฮิม ภาค คริสตจักร','ทบทวนเป้าหมายประจำเดือน','สถิติการเติบโต (เพิ่มพูน/อภิบาล/พัฒนา)','โครงการ 111 / งานประกาศ','สอนพระคัมภีร์','รายงานการถวายทรัพย์','สะท้อนปัญหา / แนวทางแก้','อธิษฐานเผื่อกัน','อื่นๆ'];
const RS={r6:{t:'แผน 111 (ไตรมาส 3-4)',fix:['การประกาศของ คจ ภายในภาค','LG','กลุ่มบุกเบิก','ศูนย์','คริสตจักร'],c:[['สิ่งที่ตั้งใจเปิด','f'],['จำนวน (แห่ง)','n'],['ชื่อผู้นำ'],['กำหนดเปิด','d'],['สิ่งที่ต้องการสนับสนุน'],['ประเมินผล Q3']]},
 r5:{t:'Best Practice & Pain Point',fix:[['Best Practice',1],['Best Practice',2],['Best Practice',3],['Pain Point',1],['Pain Point',2],['Pain Point',3]],c:[['ประเภท','f'],['ลำดับ','f'],['รายละเอียด','l']]},
 r4:{t:'ผลการดำเนินงาน ไตรมาส 3',c:[['สิ่งที่ตั้งใจไตรมาส 3','l'],['ผลลัพธ์','l'],['กิจกรรม/การประกาศ','l'],['ลิงก์ภาพ']]},
 r2:{t:'แผนสถาบัน Youth',c:[['จังหวัด'],['มหาวิทยาลัย/วิทยาลัย'],['แผนการประกาศ','l'],['แผนการสร้างสาวก','l']]},
 r8:{t:'ประชุมดาวิดภาค',c:[['วันที่ประชุม','d']].concat(AGD.map(x=>[x,'c'])).concat([['รายละเอียดเพิ่มเติม','l']])}};
let RP=null,RG='',RTp='r6',RR={};
async function repV(){if(!RP){A().innerHTML='<div class="card">กำลังโหลด…</div>';try{RP=await api('regReports');RG=RP.regs[0]||''}catch(e){return err(e)}}RR={};repDraw()}
function repRows(t){const S=RS[t],got=(RP.data[t]||[]).filter(r=>r[0]==RG).map(r=>r.slice(1));
 if(S.fix)return S.fix.map(f=>{const k=[].concat(f),g=got.find(r=>k.every((x,i)=>String(r[i])==String(x)));return g||k.concat(Array(S.c.length-k.length).fill(''))});
 return got.length?got:[Array(S.c.length).fill('')]}
function repDraw(){const S=RS[RTp];const rows=RR[RTp+RG]||(RR[RTp+RG]=repRows(RTp));
 const cell=(v,[l,ty],i,j)=>ty=='f'?`<td><b>${esc(v)}</b></td>`:ty=='c'?`<td style="text-align:center"><input type="checkbox" style="width:auto" ${v&&v!==''?'checked':''} onchange="RR['${RTp+RG}'][${i}][${j}]=this.checked"></td>`:ty=='l'?`<td><textarea rows="2" style="min-width:180px" oninput="RR['${RTp+RG}'][${i}][${j}]=this.value">${esc(v??'')}</textarea></td>`:`<td><input ${ty=='n'?'type="number" min="0" style="width:80px"':ty=='d'?'type="text" placeholder="วว/ดด/ปปปป" style="width:120px"':''} value="${esc(v??'')}" oninput="RR['${RTp+RG}'][${i}][${j}]=this.value"></td>`;
 A().innerHTML=`<div class="card"><div class="row"><div><label>ภาค</label><select onchange="RG=this.value;repDraw()">${RP.regs.map(g=>`<option ${g==RG?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div><label>รอบรายงาน</label><input disabled value="${esc(RP.round)}"></div></div>
 <div style="margin:12px 0;display:flex;gap:6px;flex-wrap:wrap">${Object.keys(RS).map(k=>`<button class="${k==RTp?'':'sec'}" onclick="RTp='${k}';repDraw()">${RS[k].t}</button>`).join('')}</div>
 <h3>${S.t} · ${esc(RG)}</h3><div class="tw"><table><tr>${S.c.map(c=>`<th>${esc(c[0])}</th>`).join('')}${S.fix?'':'<th></th>'}</tr>${rows.map((r,i)=>`<tr>${S.c.map((c,j)=>cell(r[j],c,i,j)).join('')}${S.fix?'':`<td><button class="sec" onclick="RR['${RTp+RG}'].splice(${i},1);repDraw()">ลบ</button></td>`}</tr>`).join('')}</table></div>
 ${S.fix?'':`<button class="sec" style="margin-top:8px" onclick="RR['${RTp+RG}'].push(Array(${S.c.length}).fill(''));repDraw()">+ เพิ่มแถว</button>`}
 ${ME.role=='exec'?'<p class="note">บัญชีผู้บริหาร: ดูได้อย่างเดียว</p>':'<button id="rb" style="width:100%;margin-top:14px" onclick="repSave()">บันทึกรายงาน</button>'}<div id="rm"></div></div>`}
async function repSave(){rb.disabled=true;rb.textContent='กำลังบันทึก…';const rows=RR[RTp+RG];
 try{await api('regReport',{type:RTp,reg:RG,rows});RP.data[RTp]=(RP.data[RTp]||[]).filter(r=>r[0]!=RG).concat(rows.map(r=>[RG].concat(r)));rm.innerHTML='<div class="ok">✅ บันทึกแล้ว ขอบคุณครับ</div>'}catch(e){rm.innerHTML=`<p class="dn">${esc(e.message)}</p>`}rb.disabled=false;rb.textContent='บันทึกรายงาน'}
const nz=s=>String(s||'').replace(/\s/g,'');
function scopeT(C){const T=ME.targets||{},regs=[...new Set(C.map(c=>nz(c.reg)))],o={t111:0,tlg:0,tpio:0,tcen:0,tch:0};regs.forEach(g=>{const t=T[g];if(t)for(const k in o)o[k]+=t[k]||0});return o}
function cur4(C){const R=ME.round,PR=ROUNDS.filter(r=>r<R).pop(),codes=new Set(C.map(c=>c.code)),inR=r=>ME.stats.filter(s=>s.round==r&&codes.has(s.code)),SR=inR(R),SP=inR(PR);
 const X=(A,k)=>A.reduce((t,s)=>t+(+((s.x||{})[k])||0),0),LG=A=>A.reduce((t,s)=>t+(+s.lg||0),0);
 return{SR,att:sum(C,latest),attp:sum(C,prevOf),lg:LG(SR),lgp:LG(SP),nb:X(SR,'nb'),nbp:X(SP,'nb'),sub:SR.length,subp:SP.length,n:C.length,p111:C.filter(c=>c.p111).length}}
function pg(l,v,t,col){const p=t?Math.min(100,Math.round(v/t*100)):0,c=col||(p>=100?'#2e7d32':p>=60?'#2b6cb0':p>=30?'#d69e2e':'#c0392b');
 return `<div class="pg"><div class="h"><span>${l}</span><b>${(+v||0).toLocaleString()}${t?` / ${t.toLocaleString()} <span style="color:${c}">(${p}%)</span>`:' <span class="note">· ยังไม่ได้ระบุ</span>'}</b></div><div class="t"><div class="f" style="width:${t?p:0}%;background:${c}"></div></div></div>`}
function ring(p,c){p=Math.max(0,Math.min(100,p||0));return `<div style="width:64px;height:64px;border-radius:50%;background:conic-gradient(${c} ${p*3.6}deg,#e8edf2 0);display:flex;align-items:center;justify-content:center;flex:none"><div style="width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:${c}">${p}%</div></div>`}
function gr(c,p){return p?Math.round((c-p)/p*100):null}
function tile(l,v,g,sub){const c=g==null?'#9aa5b1':g>0?'#1baf7a':g<0?'#e34948':'#2a78d6',arw=g==null?'':g>0?'▲':g<0?'▼':'▬';
 return `<div style="display:flex;gap:12px;align-items:center;background:#f6f8fa;border-radius:12px;padding:12px 14px"><div style="flex:1;min-width:0"><div class="note">${l}</div><div style="font-size:26px;font-weight:700;line-height:1.2">${(+v||0).toLocaleString()}</div><div class="note">${sub||(g==null?'อัตราการเติบโต: ยังไม่มีรอบก่อนให้เทียบ':'อัตราการเติบโตจากรอบก่อน')}</div></div>${g==null?'':dring(Math.min(100,Math.abs(g)||2),c,`<span style="color:${c};font-size:14px">${arw}${g>0?'+':''}${g}%</span>`,'',76)}</div>`}
function spark(c){const rs=ROUNDS.filter(r=>val(c,r)!=null).slice(-6),mx=Math.max(1,...rs.map(r=>val(c,r)));
 return `<div style="display:flex;gap:12px;align-items:center;background:#f6f8fa;border-radius:12px;padding:12px 14px"><div style="flex:1"><div class="note">แนวโน้มยอดนมัสการ</div><div style="display:flex;align-items:flex-end;gap:6px;height:56px;margin-top:4px">${rs.map(r=>`<div title="${r}: ${val(c,r)}" style="flex:1;background:#2b6cb0;border-radius:4px 4px 0 0;height:${Math.max(6,val(c,r)/mx*100)}%"></div>`).join('')||'<span class="note">ยังไม่มีข้อมูล</span>'}</div><div class="note" style="display:flex;justify-content:space-between"><span>${rs[0]||''}</span><span>${rs[rs.length-1]||''}</span></div></div></div>`}
function ageTile(C){const codes=new Set(C.map(c=>c.code)),last={};ME.stats.filter(s=>codes.has(s.code)&&s.x&&AGE.some(([k])=>+s.x[k])).forEach(s=>{if(!last[s.code]||last[s.code].round<s.round)last[s.code]=s});
 const L=Object.values(last),v=k=>L.reduce((t,s)=>t+(+s.x[k]||0),0),col=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6'];
 const parts=AGE.map(([k,l],i)=>[l.replace(/ปี$/,'').trim(),v(k),col[i]]),tot=parts.reduce((t,p)=>t+p[1],0);
 const mid={a1:7.5,a2:15.5,a3:20.5,a4:29,a5:47.5,a7:68},n=Object.keys(mid).reduce((t,k)=>t+v(k),0),avg=n?Math.round(Object.keys(mid).reduce((t,k)=>t+v(k)*mid[k],0)/n):null;
